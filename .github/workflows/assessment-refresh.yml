name: 5DR Assessment Handoff Refresh

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: five-dr-assessment-handoff-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Checkout canonical 5DR engine
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install assessment database driver
        run: |
          python -m pip install --disable-pip-version-check 'psycopg2-binary>=2.9,<3'
          python -m py_compile src/assessment_handoff_cli.py

      - name: Build fresh canonical assessment handoff
        run: |
          set -euo pipefail
          test -n "$DATABASE_URL"
          python -m src.assessment_handoff_cli
          test -s assessment-handoff.json

      - name: Verify fresh complete assessment contract
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone

          data=json.load(open('assessment-handoff.json',encoding='utf-8'))
          assert data.get('schema_version')=='5DR_ASSESSMENT_HANDOFF_V1', data
          generated=str(data.get('generated_at') or '')
          generated_at=datetime.fromisoformat(generated.replace('Z','+00:00'))
          age=(datetime.now(timezone.utc)-generated_at).total_seconds()
          assert -300 <= age <= 300, {'generated_at':generated,'age_seconds':age}

          assessment=data.get('assessment') or {}
          assert assessment.get('engine')=='5DR', assessment
          assert assessment.get('forecast_id'), assessment
          assert assessment.get('assessed_at'), assessment
          metrics=assessment.get('metrics') or {}
          assert metrics.get('assessment_snapshot_complete') is True, metrics
          assert metrics.get('recommendation_ledger_complete') is True, metrics
          day=metrics.get('day_metrics') or {}
          assert all(label in day for label in ('D','D+1','D+2','D+3','D+4')), day
          ledger=metrics.get('recommendation_ledger')
          assert isinstance(ledger,list), metrics
          assert len(ledger)==int(metrics.get('all_recommendations_count',-1)), metrics
          print('ASSESSMENT_HANDOFF_REFRESH_READY=PASS')
          PY

      - name: Publish canonical assessment to isolated state branch
        run: |
          set -euo pipefail
          git fetch origin state/assessment-handoff
          rm -rf /tmp/5dr-assessment-state
          git worktree add /tmp/5dr-assessment-state origin/state/assessment-handoff
          cd /tmp/5dr-assessment-state
          mkdir -p runtime
          cp "$GITHUB_WORKSPACE/assessment-handoff.json" runtime/5dr-assessment-handoff.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime/5dr-assessment-handoff.json
          if git diff --cached --quiet; then
            echo "assessment_state_unchanged"
            exit 0
          fi
          git commit -m "Refresh canonical 5DR assessment handoff [skip ci]"
          git push origin HEAD:state/assessment-handoff

      - name: Upload bounded refresh evidence
        uses: actions/upload-artifact@v4
        with:
          name: 5dr-assessment-handoff-refresh
          path: assessment-handoff.json
          retention-days: 30
          if-no-files-found: error
