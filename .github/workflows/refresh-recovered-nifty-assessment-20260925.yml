name: Refresh Recovered 25 Sep NIFTY Assessment

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-recovered-nifty-assessment-20260925.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch-normal-production-wrapper:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Dispatch normal lifecycle production wrapper
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/lifecycle-production-wrapper.yml/dispatches" \
            -d '{"ref":"main"}'
          echo "normal_lifecycle_wrapper_dispatched"
