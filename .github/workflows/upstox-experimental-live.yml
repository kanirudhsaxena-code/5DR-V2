name: Experimental Upstox read-only live verification

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/upstox-readonly-data-service
    paths:
      - 'experiments/*.py'
      - 'tests/test_experimental_upstox_*.py'
      - 'phase1/upstox.py'
      - '.github/workflows/upstox-experimental-live.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'experiments/*.py'
      - 'tests/test_experimental_upstox_*.py'
      - 'phase1/upstox.py'
      - '.github/workflows/upstox-experimental-live.yml'

permissions:
  contents: read

concurrency:
  group: experimental-upstox-readonly-live-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Existing Upstox read-only safety tests
        run: python -m unittest discover -s tests -p 'test_upstox_readonly.py' -v
      - name: Experimental reliability and boundary tests
        run: python -m unittest discover -s tests -p 'test_experimental_upstox_*.py' -v
      - name: Curl read-only transport preflight
        if: github.event_name != 'pull_request' && !contains(github.event.head_commit.message, '[backfill-dry-run]') && !contains(github.event.head_commit.message, '[backfill-smoke]') && !contains(github.event.head_commit.message, '[cache-offline]')
        env:
          UPSTOX_ANALYTICS_TOKEN: ${{ secrets.UPSTOX_ANALYTICS_TOKEN }}
        run: |
          code="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --get \
            --data-urlencode 'instrument_key=NSE_INDEX|Nifty 50' \
            --header 'Accept: application/json' \
            --header "Authorization: Bearer ${UPSTOX_ANALYTICS_TOKEN}" \
            'https://api.upstox.com/v3/market-quote/ltp')"
          echo "curl_market_quote_http_status=${code}"
          test "${code}" = '200'
      - name: Authenticated read-only manifested live sample
        if: github.event_name != 'pull_request' && !contains(github.event.head_commit.message, '[backfill-dry-run]') && !contains(github.event.head_commit.message, '[backfill-smoke]') && !contains(github.event.head_commit.message, '[cache-offline]') && !contains(github.event.head_commit.message, '[chart-probe]')
        env:
          UPSTOX_ANALYTICS_TOKEN: ${{ secrets.UPSTOX_ANALYTICS_TOKEN }}
        run: python -m experiments.run_upstox_manifested_sample
      - name: 5DR quantitative backbone broad live probe
        if: always() && github.event_name == 'push' && contains(github.event.head_commit.message, '[quant-probe]')
        env:
          UPSTOX_ANALYTICS_TOKEN: ${{ secrets.UPSTOX_ANALYTICS_TOKEN }}
        run: python -m experiments.run_upstox_quant_probe
      - name: Representative bounded historical live probe
        if: always() && github.event_name == 'push' && contains(github.event.head_commit.message, '[history-probe]')
        env:
          UPSTOX_ANALYTICS_TOKEN: ${{ secrets.UPSTOX_ANALYTICS_TOKEN }}
        run: python -m experiments.run_upstox_history_probe
      - name: Live multi-timeframe chart derivation proof
        if: always() && github.event_name == 'push' && contains(github.event.head_commit.message, '[chart-probe]')
        env:
          UPSTOX_ANALYTICS_TOKEN: ${{ secrets.UPSTOX_ANALYTICS_TOKEN }}
        run: python -m experiments.run_upstox_chart_probe
      - name: Backfill/cache budget dry run
        if: always() && github.event_name == 'push' && contains(github.event.head_commit.message, '[backfill-dry-run]')
        run: python -m experiments.run_backfill_dry_run
      - name: Backfill one-call ephemeral live smoke
        if: always() && github.event_name == 'push' && contains(github.event.head_commit.message, '[backfill-smoke]')
        env:
          UPSTOX_ANALYTICS_TOKEN: ${{ secrets.UPSTOX_ANALYTICS_TOKEN }}
        run: python -m experiments.run_backfill_smoke
      - name: Time-separated duplicate and freshness reliability check
        if: github.event_name != 'pull_request' && !contains(github.event.head_commit.message, '[quant-probe]') && !contains(github.event.head_commit.message, '[history-probe]') && !contains(github.event.head_commit.message, '[chart-probe]') && !contains(github.event.head_commit.message, '[backfill-dry-run]') && !contains(github.event.head_commit.message, '[backfill-smoke]') && !contains(github.event.head_commit.message, '[cache-offline]')
        env:
          UPSTOX_ANALYTICS_TOKEN: ${{ secrets.UPSTOX_ANALYTICS_TOKEN }}
          UPSTOX_RELIABILITY_DELAY_SECONDS: '75'
        run: python -m experiments.run_upstox_reliability_pair
