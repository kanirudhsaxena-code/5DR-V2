name: BT100 readiness (isolated read-only)

on:
  push:
    branches:
      - bt100-readiness-v0-20261005
    paths:
      - 'bt100/**'
      - 'tests/test_bt100_*.py'
      - '.github/workflows/bt100-readiness.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bt100-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: BT100 fail-closed unit tests
        run: python -m unittest discover -s tests -p 'test_bt100_*.py' -v
      - name: Static readiness report
        run: python -m bt100.readiness --output .bt100/readiness-static.json
      - name: Assert static report has zero production-neuron budget
        run: |
          python - <<'PY'
          import json
          report=json.load(open('.bt100/readiness-static.json'))
          assert report['production_neuron_budget'] == 0
          assert report['production_writes_allowed'] is False
          assert report['trading_allowed'] is False
          assert report['formal_replay_ready'] is False
          PY

  live_readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: unit
    env:
      UPSTOX_ANALYTICS_TOKEN: ${{ secrets.UPSTOX_ANALYTICS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare artifact directory
        run: mkdir -p .bt100
      - name: Select 100 independent matured target sessions
        run: python -m bt100.select_target_dates > .bt100/target_dates.json
      - name: Probe expired derivative entitlement and OI
        id: expired_probe
        continue-on-error: true
        run: python -m bt100.upstox_expired_probe > .bt100/upstox_expired_probe.json
      - name: Surface sanitized expired-probe diagnostic
        if: always()
        run: cat .bt100/upstox_expired_probe.json
      - name: Probe historical OI and change-OI independently
        id: market_info_probe
        continue-on-error: true
        run: python -m bt100.upstox_market_info_probe > .bt100/upstox_market_info_probe.json
      - name: Surface sanitized market-info diagnostic
        if: always()
        run: cat .bt100/upstox_market_info_probe.json
      - name: Build readiness certificate V0
        if: always()
        continue-on-error: true
        run: |
          python -m bt100.readiness \
            --target-dates .bt100/target_dates.json \
            --probe .bt100/upstox_expired_probe.json \
            --output .bt100/readiness-v0.json
      - name: Prove zero production inference/write declarations
        if: always()
        run: |
          python - <<'PY'
          import json
          for path in ('.bt100/target_dates.json','.bt100/upstox_expired_probe.json'):
              obj=json.load(open(path))
              assert obj.get('production_neuron_calls',0) == 0
              assert obj.get('production_writes',0) == 0
              assert obj.get('trading_enabled',False) is False
          PY
      - name: Upload bounded readiness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bt100-readiness-v0
          path: .bt100/*.json
          if-no-files-found: error
          retention-days: 30
          include-hidden-files: true

      - name: Enforce live derivative readiness
        if: always()
        run: test "${{ steps.expired_probe.outcome }}" = "success"


  core_history_backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: unit
    env:
      UPSTOX_ANALYTICS_TOKEN: ${{ secrets.UPSTOX_ANALYTICS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Acquire isolated core quantitative history
        id: core_history
        continue-on-error: true
        run: |
          mkdir -p bt100_artifacts/core_history
          python -m bt100.run_core_history_backfill \
            --frozen-sessions bt100/config/frozen_sessions_v1.json \
            --output-dir bt100_artifacts/core_history \
            > bt100_artifacts/core_history_run.json
      - name: Surface core-history failure diagnostic
        if: always()
        run: |
          if [ -f bt100_artifacts/core_history/failure.json ]; then cat bt100_artifacts/core_history/failure.json; fi
      - name: Prove core-history safety declarations
        if: steps.core_history.outcome == 'success'
        run: |
          python - <<'PY'
          import json
          m=json.load(open('bt100_artifacts/core_history/manifest.json'))
          assert m['production_writes'] == 0
          assert m['production_neuron_calls'] == 0
          assert m['trading_enabled'] is False
          assert m['series_count'] > 0
          PY
      - name: Upload frozen core-history artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bt100-core-history-${{ github.sha }}
          path: bt100_artifacts/core_history
          if-no-files-found: error
          retention-days: 30
          compression-level: 9
      - name: Enforce core-history result
        if: always()
        run: test "${{ steps.core_history.outcome }}" = "success"
