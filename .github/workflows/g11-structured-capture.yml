name: G11 structured same-cutoff evidence capture

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/upstox-readonly-data-service
    paths:
      - '.g11/trigger.txt'

permissions:
  contents: read

concurrency:
  group: g11-structured-capture-${{ github.ref }}
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: G11 capture and pairing boundary tests
        run: |
          python -m unittest tests.test_experimental_upstox_g11_live_capture -v
          python -m unittest tests.test_experimental_upstox_shadow_pairing -v
          python -m unittest tests.test_experimental_upstox_shadow_validation -v
      - name: Freeze exact-cutoff structured evidence
        id: g11_capture
        env:
          UPSTOX_ANALYTICS_TOKEN: ${{ secrets.UPSTOX_ANALYTICS_TOKEN }}
        run: python -m experiments.run_g11_structured_capture
      - name: Save exact frozen G11 structured capture
        if: steps.g11_capture.outcome == 'success'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .shadow/g11_capture
          key: 5dr-g11-structured-${{ steps.g11_capture.outputs.pair_id }}-${{ steps.g11_capture.outputs.bundle_sha256 }}
