name: Portfolio close Upstox probe
on:
  push:
    branches:
      - experiment/upstox-readonly-data-service
    paths:
      - '.g11/portfolio_close_request.txt'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Fetch exact Upstox closes and calculate portfolio move
        env:
          UPSTOX_ANALYTICS_TOKEN: ${{ secrets.UPSTOX_ANALYTICS_TOKEN }}
        run: python -m experiments.run_portfolio_close_probe
