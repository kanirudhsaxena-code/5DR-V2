name: Dispatch G3 5DR Learning Lab Now

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dispatch-g3-learning-lab-now.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch production 5DR Learning Lab workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run learning-lab-daily.yml --repo "${{ github.repository }}" --ref main
