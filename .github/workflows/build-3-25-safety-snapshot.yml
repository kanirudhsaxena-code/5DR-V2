name: Build 3.25 5DR Safety Snapshot

on:
  push:
    branches: [build-3.25-data-integrity-20261008]
    paths:
      - '.github/workflows/build-3-25-safety-snapshot.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare PostgreSQL 17 client
        run: docker pull postgres:17
      - name: Capture bounded safety snapshot
        run: |
          set -euo pipefail
          umask 077
          test -n "${DATABASE_URL:-}"
          # Write the custom-format dump on the runner, not in an unmounted container /work path.
          docker run --rm postgres:17 pg_dump "$DATABASE_URL" --format=custom --no-owner --no-privileges \
            -t public.forecasts \
            -t public.daily_forecasts \
            -t public.outcome_checkpoints \
            -t public.forecast_checkpoint_evaluations \
            -t public.recommendation_events \
            -t public.assessment_snapshots \
            -t public.canonical_selections \
            -t public.forecast_governance \
            > build-3-25-5dr-safety.dump
          test -s build-3-25-5dr-safety.dump
          # Reject truncated/invalid backup bytes before declaring the safety gate green.
          docker run -i --rm postgres:17 pg_restore --list < build-3-25-5dr-safety.dump > /dev/null
          docker run --rm postgres:17 psql "$DATABASE_URL" -At -F ',' -c "
            select 'forecasts',count(*) from forecasts union all
            select 'daily_forecasts',count(*) from daily_forecasts union all
            select 'outcome_checkpoints',count(*) from outcome_checkpoints union all
            select 'checkpoint_evaluations',count(*) from forecast_checkpoint_evaluations union all
            select 'recommendation_events',count(*) from recommendation_events union all
            select 'assessment_snapshots',count(*) from assessment_snapshots union all
            select 'canonical_selections',count(*) from canonical_selections
          " > build-3-25-5dr-safety-counts.csv
          sha256sum build-3-25-5dr-safety.dump build-3-25-5dr-safety-counts.csv > build-3-25-5dr-safety.sha256
          cat build-3-25-5dr-safety-counts.csv
          cat build-3-25-5dr-safety.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: build-3-25-5dr-safety-snapshot
          # GitHub CI retains the non-sensitive verification manifest only.
          # A durable, access-controlled restore point is required in Neon before any cleanup deletion.
          path: |
            build-3-25-5dr-safety-counts.csv
            build-3-25-5dr-safety.sha256
          retention-days: 30
          if-no-files-found: error
