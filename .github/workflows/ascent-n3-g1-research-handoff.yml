name: ASCENT N3 G1 - Exa ChatGPT research database handoff
on:
  push:
    branches:
      - ascent-n3/g1-data-feasibility
    paths:
      - 'experiments/g1_research_fixtures/rbi_2026-10-07.json'
      - 'experiments/ascent_n3_g1_research_proof.py'
      - '.github/workflows/ascent-n3-g1-research-handoff.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ascent-n3-g1-research-handoff
  cancel-in-progress: false
jobs:
  research-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install database driver
        run: python -m pip install --disable-pip-version-check 'psycopg[binary]>=3.2,<4'
      - name: Commit research manifest (isolated G1 tables only)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m experiments.ascent_n3_g1_research_proof produce
      - name: Independent process validates persisted hash, run identity and engine contract
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m experiments.ascent_n3_g1_research_proof consume
      - name: Preserve sanitized evidence, including failure receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ascent-g1-research-handoff-${{ github.run_id }}
          path: |
            .g1/research-evidence.json
            .g1/research-manifest-commit.json
            .g1/research-consumer-ack.json
          retention-days: 30
          if-no-files-found: warn
