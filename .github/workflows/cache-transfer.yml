name: Prepare cache transfer branch

on:
  push:
    branches:
      - experiment/upstox-readonly-data-service
    paths:
      - '.g11/cache_transfer_trigger.txt'

permissions:
  contents: write
  actions: read

jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Download validated 29-series artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 35309279223 --repo ${{ github.repository }} --name 5dr-29-series-cache-export-2026-09-17 --dir cache_transfer
      - name: Verify artifact manifest shape
        run: |
          python - <<'PY'
          import json,glob
          m=json.load(open('cache_transfer/manifest.json'))
          assert m['series_count']==29
          assert m['actual_provider_calls']==90
          assert m['billable_units']==0
          assert len(glob.glob('cache_transfer/documents/*.json'))==29
          print('CACHE_TRANSFER_ARTIFACT_VERIFIED')
          PY
      - name: Push temporary transfer branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B cache-transfer-20260918
          git add -f cache_transfer
          git commit -m '[cache-transfer] validated 29-series documents'
          git push --force origin cache-transfer-20260918
