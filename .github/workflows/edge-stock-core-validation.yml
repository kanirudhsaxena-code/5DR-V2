name: EDGE Stocks Core Validation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['runtime/edge_stock_core_validation_trigger.txt']
permissions:
  contents: read
concurrency:
  group: edge-stock-core-validation
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Regression boundary
        run: |
          python -m unittest tests.test_edge_stock_consumer -v
          python -m unittest tests.test_edge_stock_upstox -v
          python -m unittest tests.test_edge_stock_market_acquire -v
          python -m unittest tests.test_edge_stock_orchestrator -v
      - name: Run representative provider-core validation
        env:
          UPSTOX_ANALYTICS_TOKEN: ${{ secrets.UPSTOX_ANALYTICS_TOKEN }}
        run: python -m experiments.run_edge_stock_core_validation
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: edge-stock-core-validation-${{ github.run_id }}
          path: .edge_stock/core_validation
          if-no-files-found: error
          retention-days: 30
