name: 5DR Lifecycle Accounting

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: five-dr-lifecycle-accounting
  cancel-in-progress: false

jobs:
  safety-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify lifecycle activation firewall
        run: python -m pytest -q tests/test_lifecycle_worker.py tests/test_lifecycle_evidence_persistence.py tests/test_lifecycle_orchestrator.py tests/test_lifecycle_executor.py
      - name: Production writes remain disabled
        env:
          LIFECYCLE_WRITES_ENABLED: 'false'
        run: |
          test "$LIFECYCLE_WRITES_ENABLED" = "false"
          echo "Lifecycle accounting validated; production writes are not activated."

# Production schedule and DATABASE_URL write credentials are intentionally absent.
# They may be added only after the explicit production activation approval gate.
