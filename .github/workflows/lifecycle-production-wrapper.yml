name: 5DR Lifecycle Production Wrapper

on:
  workflow_dispatch:
  schedule:
    - cron: '15 4-10 * * 1-5'

concurrency:
  group: five-dr-lifecycle-production-v222
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-24.04
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      LIFECYCLE_WRITES_ENABLED: 'true'
      EVIDENCE_PATH: runtime/evidence.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate activation safety suite
        run: |
          python -m pip install --upgrade pip pytest psycopg2-binary
          python -m pytest -q tests/test_production_activation.py tests/test_evidence_handoff.py tests/test_production_lifecycle_runner.py tests/test_lifecycle_db_adapter.py tests/test_production_cli.py
      - name: Verify production database connection (read-only probe)
        run: |
          test -n "$DATABASE_URL"
          python - <<'PY'
          import os
          import psycopg2
          conn = psycopg2.connect(os.environ['DATABASE_URL'])
          try:
              with conn.cursor() as cur:
                  cur.execute("SELECT COUNT(*) FROM v_recommendation_lifecycle_v222 WHERE lifecycle_status IN ('OPEN','OPEN_T1_HIT') AND recommendation IN ('BUY_CE','BUY_PE','BUY_CONVEXITY')")
                  open_count = cur.fetchone()[0]
                  cur.execute("SELECT COUNT(*) FROM outcome_checkpoints WHERE status='DUE' AND due_date <= CURRENT_DATE")
                  due_count = cur.fetchone()[0]
              print(f'production_read_probe_ok open_actionable={open_count} due_checkpoints={due_count}')
          finally:
              conn.close()
          PY
      - name: Locate governed evidence handoff
        id: evidence
        shell: bash
        run: |
          if [ -s "$EVIDENCE_PATH" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Validate evidence handoff before any write
        if: steps.evidence.outputs.present == 'true'
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from src.evidence_handoff import load_packets
          packets = load_packets(Path(os.environ['EVIDENCE_PATH']))
          if not packets:
              raise SystemExit('Empty evidence handoff is not write-eligible')
          print(f'validated_evidence_packets={len(packets)}')
          PY
      - name: Execute governed lifecycle handoff
        if: steps.evidence.outputs.present == 'true'
        run: |
          python -m src.production_cli --evidence "$EVIDENCE_PATH" | tee activation-audit.json
      - name: Fail closed when no evidence handoff exists
        if: steps.evidence.outputs.present != 'true'
        run: |
          printf '%s\n' '{"mode":"NO_WRITE","writes_enabled":false,"reason":"NO_EVIDENCE_HANDOFF","database_connection":"CONFIGURED_VIA_SECRET"}' > activation-audit.json
      - name: Publish latest cumulative assessment to EDGE Console
        env:
          EDGE_CONSOLE_URL: https://sole.k-anirudhsaxena.workers.dev
        run: |
          python - <<'PY'
          import json, os, urllib.request
          import psycopg2

          conn = psycopg2.connect(os.environ["DATABASE_URL"])
          try:
              with conn.cursor() as cur:
                  cur.execute("""
                      SELECT forecast_id, assessment_as_of, overall_forecast_metrics,
                             day_metrics, recommendation_metrics
                      FROM assessment_snapshots
                      ORDER BY assessment_as_of DESC, assessment_snapshot_id DESC
                      LIMIT 1
                  """)
                  row = cur.fetchone()
                  if not row:
                      print("assessment_publish_skipped=no_snapshot")
                      raise SystemExit(0)
                  forecast_id, assessed_at, overall, day_metrics, rec = row
                  cur.execute("""
                      WITH terminal AS (
                        SELECT DISTINCT ON (forecast_id)
                          forecast_id,event_type,pnl_pct,event_timestamp
                        FROM recommendation_events
                        WHERE event_type IN ('T2_HIT','SL_HIT','THESIS_EXIT','TIME_EXIT')
                        ORDER BY forecast_id,event_timestamp DESC
                      )
                      SELECT COALESCE(SUM(pnl_pct),0),
                             COALESCE(SUM(pnl_pct) FILTER (WHERE pnl_pct>0),0),
                             COALESCE(SUM(pnl_pct) FILTER (WHERE pnl_pct<0),0)
                      FROM terminal
                  """)
                  cumulative, hits_return, misses_return = cur.fetchone()
          finally:
              conn.close()

          metrics = {
              "overall_forecast_metrics": overall or {},
              "day_metrics": day_metrics or {},
              "recommendation_metrics": rec or {},
              "return_metrics": {
                  "cumulative_resolved_pnl_pct": float(cumulative or 0),
                  "hit_pnl_pct": float(hits_return or 0),
                  "miss_pnl_pct": float(misses_return or 0),
                  "method": "sum of resolved standardized model P&L percentages across actionable recommendations",
              },
          }
          directional_hits = int((overall or {}).get("directional_hits") or 0)
          scorable = int((overall or {}).get("canonical_scorable_checkpoints") or (overall or {}).get("canonical_scorable") or 0)
          wins = int((rec or {}).get("wins") or 0)
          resolved = int((rec or {}).get("resolved") or 0)
          headline = (overall or {}).get("headline") or f"{directional_hits}/{scorable} directionally correct"
          payload = {
              "engine": "5DR",
              "forecast_id": forecast_id,
              "assessed_at": assessed_at.isoformat(),
              "outcome": f"{headline}; {wins}/{resolved} resolved recommendations won",
              "score": (overall or {}).get("directional_accuracy_pct"),
              "metrics": metrics,
          }
          req = urllib.request.Request(
              os.environ["EDGE_CONSOLE_URL"].rstrip("/") + "/api/assessment-import",
              data=json.dumps(payload).encode("utf-8"),
              headers={"Content-Type":"application/json"},
              method="POST",
          )
          with urllib.request.urlopen(req, timeout=30) as response:
              print("assessment_publish_status=" + str(response.status))
              print(response.read().decode("utf-8"))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: lifecycle-production-wrapper-audit
          path: activation-audit.json
          retention-days: 30
