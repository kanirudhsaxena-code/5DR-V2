name: 5DR Lifecycle Production Wrapper

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/checkpoint_reconciliation.py'
      - 'src/checkpoint_reconcile_cli.py'
      - 'src/console_forecast_sync.py'
      - 'src/console_forecast_sync_cli.py'
      - '.github/workflows/lifecycle-production-wrapper.yml'
  schedule:
    - cron: '15 3-11 * * 1-5'

concurrency:
  group: five-dr-lifecycle-production-v222
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  guard:
    runs-on: ubuntu-24.04
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      UPSTOX_ANALYTICS_TOKEN: ${{ secrets.UPSTOX_ANALYTICS_TOKEN }}
      LIFECYCLE_WRITES_ENABLED: 'true'
      EVIDENCE_PATH: runtime/evidence.json
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate activation safety suite
        run: |
          python -m pip install --upgrade pip pytest psycopg2-binary
          python -m pytest -q tests/test_production_activation.py tests/test_evidence_handoff.py tests/test_production_lifecycle_runner.py tests/test_lifecycle_db_adapter.py tests/test_production_cli.py tests/test_checkpoint_reconciliation.py tests/test_checkpoint_reconciliation_workflow.py tests/test_console_forecast_sync.py
      - name: Verify production database connection (read-only probe)
        run: |
          test -n "$DATABASE_URL"
          python - <<'PY'
          import os
          import psycopg2
          conn = psycopg2.connect(os.environ['DATABASE_URL'])
          try:
              with conn.cursor() as cur:
                  cur.execute("SELECT COUNT(*) FROM v_recommendation_lifecycle_v222 WHERE lifecycle_status IN ('OPEN','OPEN_T1_HIT') AND recommendation IN ('BUY_CE','BUY_PE','BUY_CONVEXITY')")
                  open_count = cur.fetchone()[0]
                  cur.execute("SELECT COUNT(*) FROM outcome_checkpoints WHERE status='DUE' AND due_date <= CURRENT_DATE")
                  due_count = cur.fetchone()[0]
              print(f'production_read_probe_ok open_actionable={open_count} due_checkpoints={due_count}')
          finally:
              conn.close()
          PY
      - name: Synchronize complete EDGE Console forecasts into canonical ledger
        env:
          EDGE_CONSOLE_HANDOFF_URL: https://raw.githubusercontent.com/kanirudhsaxena-code/EDGE-CONSOLE/state/5dr-handoff/runtime/5dr-canonical-handoff.json
        run: |
          python -m src.console_forecast_sync_cli | tee console-canonical-sync.json
      - name: Reconcile due canonical NIFTY checkpoints
        run: |
          test -n "$UPSTOX_ANALYTICS_TOKEN"
          python -m src.checkpoint_reconcile_cli | tee checkpoint-reconciliation.json
      - name: Locate governed evidence handoff
        id: evidence
        shell: bash
        run: |
          if [ -s "$EVIDENCE_PATH" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Validate evidence handoff before any write
        if: steps.evidence.outputs.present == 'true'
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from src.evidence_handoff import load_packets
          packets = load_packets(Path(os.environ['EVIDENCE_PATH']))
          if not packets:
              raise SystemExit('Empty evidence handoff is not write-eligible')
          print(f'validated_evidence_packets={len(packets)}')
          PY
      - name: Execute governed lifecycle handoff
        if: steps.evidence.outputs.present == 'true'
        run: |
          python -m src.production_cli --evidence "$EVIDENCE_PATH" | tee activation-audit.json
      - name: Fail closed when no evidence handoff exists
        if: steps.evidence.outputs.present != 'true'
        run: |
          printf '%s\n' '{"mode":"NO_WRITE","writes_enabled":false,"reason":"NO_EVIDENCE_HANDOFF","database_connection":"CONFIGURED_VIA_SECRET"}' > activation-audit.json
      - name: Build current cumulative assessment handoff
        run: python -m src.assessment_handoff_cli

      - name: Publish canonical assessment to isolated state branch
        run: |
          set -euo pipefail
          test -s assessment-handoff.json
          git fetch origin state/assessment-handoff
          rm -rf /tmp/5dr-assessment-state
          git worktree add /tmp/5dr-assessment-state origin/state/assessment-handoff
          cd /tmp/5dr-assessment-state
          mkdir -p runtime
          cp "$GITHUB_WORKSPACE/assessment-handoff.json" runtime/5dr-assessment-handoff.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime/5dr-assessment-handoff.json
          if git diff --cached --quiet; then
            echo "assessment_state_unchanged"
            exit 0
          fi
          git commit -m "Update canonical 5DR assessment handoff [skip ci]"
          git push origin HEAD:state/assessment-handoff
      - uses: actions/upload-artifact@v4
        with:
          name: lifecycle-production-wrapper-audit
          path: |
            activation-audit.json
            console-canonical-sync.json
            checkpoint-reconciliation.json
            assessment-handoff.json
          retention-days: 30
