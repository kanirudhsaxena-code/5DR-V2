name: 5DR Prompt Invocation Guard

on:
  workflow_dispatch:
    inputs:
      command:
        description: 'Strict command: 5DR or 5DR NIFTY'
        required: true
        default: '5DR'
        type: string
      request_id:
        description: 'Unique request identifier'
        required: true
        type: string
      requested_at:
        description: 'Timezone-aware ISO-8601 timestamp'
        required: true
        type: string

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Verify strict prompt invocation contract
        run: python -m pytest -q tests/test_prompt_invocation.py
      - name: Plan governed invocation
        run: >-
          python -m experiments.run_prompt_invocation
          --command "${{ inputs.command }}"
          --request-id "${{ inputs.request_id }}"
          --requested-at "${{ inputs.requested_at }}"
