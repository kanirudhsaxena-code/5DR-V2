name: Autonomous acquisition CI
on:
  pull_request:
    paths:
      - 'src/autonomous_acquisition.py'
      - 'src/upstox_evidence.py'
      - 'src/event_evidence.py'
      - 'src/acquisition_shadow_runner.py'
      - 'tests/test_autonomous_acquisition.py'
      - 'tests/test_upstox_evidence.py'
      - 'tests/test_event_evidence.py'
      - 'tests/test_acquisition_shadow_runner.py'
      - '.github/workflows/autonomous-acquisition-*.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: |
          python -m unittest tests.test_autonomous_acquisition -v
          python -m unittest tests.test_upstox_evidence -v
          python -m unittest tests.test_event_evidence -v
          python -m unittest tests.test_acquisition_shadow_runner -v
