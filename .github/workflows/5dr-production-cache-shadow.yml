name: 5DR V2.2.3 Production Cache Historical Shadow

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'runtime/cache_shadow_trigger.txt'

permissions:
  contents: read

jobs:
  shadow:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install guarded cache database driver
        run: python -m pip install --disable-pip-version-check 'psycopg[binary]>=3.2,<4'
      - name: Run historical-only production cache shadow
        env:
          UPSTOX_ANALYTICS_TOKEN: ${{ secrets.UPSTOX_ANALYTICS_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m experiments.run_production_cache_shadow
      - name: Upload cache shadow audit
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: 5dr-production-cache-shadow-${{ github.run_id }}
          path: .production/cache_shadow/audit.json
          if-no-files-found: error
          retention-days: 30
