name: Incremental cache refresh readiness

on:
  push:
    branches:
      - experiment/upstox-readonly-data-service
    paths:
      - '.g11/incremental_refresh_trigger.txt'

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Prove incremental refresh planning
        run: python -m experiments.run_incremental_refresh_readiness
