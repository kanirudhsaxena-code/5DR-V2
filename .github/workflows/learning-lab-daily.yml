name: 5DR Daily Learning Lab Snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * 1-5'

permissions:
  contents: write

concurrency:
  group: five-dr-learning-lab-daily
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      LEARNING_HANDOFF_PATH: 5dr-learning-lab-handoff.json
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install read-only database client
        run: python -m pip install --upgrade pip psycopg2-binary
      - name: Verify Learning Lab safety and snapshot tests
        run: python -m pytest -q tests/test_learning_lab.py tests/test_learning_governance.py tests/test_learning_observations.py tests/test_learning_snapshot.py
      - name: Build read-only daily Learning Lab handoff
        run: python -m src.learning_snapshot_cli
      - name: Publish immutable daily handoff to isolated state branch
        run: |
          set -euo pipefail
          test -s "$LEARNING_HANDOFF_PATH"
          git fetch origin state/assessment-handoff
          rm -rf /tmp/5dr-learning-state
          git worktree add /tmp/5dr-learning-state origin/state/assessment-handoff
          cd /tmp/5dr-learning-state
          mkdir -p runtime
          cp "$GITHUB_WORKSPACE/$LEARNING_HANDOFF_PATH" runtime/5dr-learning-lab-handoff.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime/5dr-learning-lab-handoff.json
          if git diff --cached --quiet; then
            echo "learning_handoff_state_unchanged"
            exit 0
          fi
          git commit -m "Update 5DR daily Learning Lab handoff [skip ci]"
          git push origin HEAD:state/assessment-handoff
      - uses: actions/upload-artifact@v4
        with:
          name: 5dr-learning-lab-daily
          path: 5dr-learning-lab-handoff.json
          retention-days: 30
