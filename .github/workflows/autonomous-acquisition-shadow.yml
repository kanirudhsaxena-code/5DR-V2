name: 5DR autonomous acquisition shadow
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: 5dr-autonomous-acquisition-shadow
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Acquisition boundary tests
        run: |
          python -m unittest tests.test_autonomous_acquisition -v
          python -m unittest tests.test_upstox_evidence -v
          python -m unittest tests.test_event_evidence -v
      - name: Existing Upstox read-only tests
        run: python -m unittest discover -s tests -p 'test_upstox_readonly.py' -v
      - name: Live Upstox acquisition probe (non-publishing)
        env:
          UPSTOX_ANALYTICS_TOKEN: ${{ secrets.UPSTOX_ANALYTICS_TOKEN }}
        run: python -m phase1.upstox
