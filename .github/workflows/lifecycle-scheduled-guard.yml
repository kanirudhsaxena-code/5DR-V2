name: 5DR Lifecycle Scheduled Guard

on:
  workflow_dispatch:
  schedule:
    # Hourly on weekdays. Runner remains NO_WRITE unless a future approved
    # evidence/DB adapter explicitly enables guarded production persistence.
    - cron: '15 * * * 1-5'

concurrency:
  group: five-dr-lifecycle-v222
  cancel-in-progress: false

permissions:
  contents: read

env:
  LIFECYCLE_WRITES_ENABLED: 'false'

jobs:
  safety-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependency
        run: python -m pip install --upgrade pip pytest
      - name: Verify lifecycle safety suite
        run: python -m pytest -q tests/test_lifecycle_worker.py tests/test_lifecycle_evidence_persistence.py tests/test_lifecycle_db_adapter.py tests/test_lifecycle_orchestrator.py tests/test_lifecycle_executor.py tests/test_evidence_bridge.py tests/test_lifecycle_bridge.py tests/test_production_lifecycle_runner.py tests/test_run_audit.py
      - name: Assert production writes remain disabled
        run: test "$LIFECYCLE_WRITES_ENABLED" = "false"
      - name: Emit fail-closed audit marker
        run: |
          mkdir -p audit
          printf '{"mode":"SCHEDULED_GUARD","writes_enabled":false,"evidence_adapter":"NOT_ATTACHED","database_adapter":"NOT_ATTACHED","result":"NO_WRITE"}\n' > audit/lifecycle-guard.json
      - name: Upload audit marker
        uses: actions/upload-artifact@v4
        with:
          name: lifecycle-guard-audit
          path: audit/lifecycle-guard.json
          retention-days: 30
