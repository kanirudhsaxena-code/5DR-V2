name: Upstox read-only acquisition probe
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: upstox-readonly-probe
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Offline read-only tests
        run: python -m unittest discover -s tests -p 'test_upstox_readonly.py' -v
      - name: Read-only Upstox probe
        env:
          UPSTOX_ANALYTICS_TOKEN: ${{ secrets.UPSTOX_ANALYTICS_TOKEN }}
        run: python -m phase1.upstox
