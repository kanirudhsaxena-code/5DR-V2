name: EDGE Stocks Fallback Validation
on:
  pull_request:
    paths:
      - 'experiments/edge_stock_source_registry.py'
      - 'experiments/edge_stock_peer_fallback.py'
      - 'experiments/run_edge_stock_peer_fallback_validation.py'
      - '.github/workflows/edge-stock-fallback-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-peer-fallback:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Contract tests
        run: python -m unittest tests.test_edge_stock_peer_fallback -v
      - name: Live fallback proof
        run: python -m experiments.run_edge_stock_peer_fallback_validation
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: edge-stock-peer-fallback-${{ github.run_id }}
          path: .edge_stock/peer_fallback
          if-no-files-found: error
          retention-days: 30
