name: ASCENT N3 G1 - existing Upstox integration source proof
on:
  push:
    branches:
      - ascent-n3/g1-data-feasibility
    paths:
      - '.github/workflows/ascent-n3-g1-data-probe.yml'
      - 'experiments/ascent_n3_g1_probe.py'
      - 'experiments/ascent_n3_g1_freshness.py'
      - 'experiments/ascent_n3_g1_depth.py'
      - 'tests/test_ascent_n3_g1_probe.py'
      - 'tests/test_ascent_n3_g1_freshness.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ascent-n3-g1-data-feasibility
  cancel-in-progress: false
jobs:
  read-only-data-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Source and negative contract tests (offline)
        run: python -m unittest discover -s tests -p 'test_ascent_n3_g1_*.py' -v
      - name: Authenticated read-only source and Plus endpoint verification
        env:
          UPSTOX_ANALYTICS_TOKEN: ${{ secrets.UPSTOX_ANALYTICS_TOKEN }}
          G1_OUTPUT_FILE: .g1/evidence.json
        run: python -m experiments.ascent_n3_g1_probe
      - name: Distinct current-session freshness and option history probe
        if: always()
        env:
          UPSTOX_ANALYTICS_TOKEN: ${{ secrets.UPSTOX_ANALYTICS_TOKEN }}
        run: python -m experiments.ascent_n3_g1_freshness
      - name: Optional option-chain and older-expiry retention diagnostics
        if: always()
        env:
          UPSTOX_ANALYTICS_TOKEN: ${{ secrets.UPSTOX_ANALYTICS_TOKEN }}
        run: python -m experiments.ascent_n3_g1_depth
      - name: Retain sanitized evidence on failure or success
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ascent-n3-g1-probe-${{ github.run_id }}
          path: |
            .g1/evidence.json
            .g1/freshness.json
            .g1/depth-retention.json
          retention-days: 30
          if-no-files-found: warn
