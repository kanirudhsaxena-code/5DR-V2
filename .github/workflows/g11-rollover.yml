name: G11 next-session rollover

on:
  push:
    branches:
      - experiment/upstox-readonly-data-service
    paths:
      - '.g11/rollover_trigger.txt'

permissions:
  contents: read

concurrency:
  group: g11-rollover-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rollover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Approved fail-closed rollover validator tests
        run: python -m unittest tests.test_experimental_g11_rollover -v
      - name: Execute read-only next-session rollover
        id: rollover
        env:
          UPSTOX_ANALYTICS_TOKEN: ${{ secrets.UPSTOX_ANALYTICS_TOKEN }}
        run: python -m experiments.run_g11_rollover
      - name: Cache exact rollover evidence
        if: steps.rollover.outcome == 'success'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .shadow/g11_rollover
          key: 5dr-g11-rollover-${{ steps.rollover.outputs.session_date }}-${{ steps.rollover.outputs.gate_sha256 }}
      - name: Upload bounded rollover gate artifact
        if: steps.rollover.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: g11-rollover-${{ steps.rollover.outputs.session_date }}
          path: |
            .shadow/g11_rollover/rollover_gate.json
            .shadow/g11_rollover/capture.json
          if-no-files-found: error
          retention-days: 1
